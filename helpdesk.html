<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="author" content="Andy Nguyen">
        <meta name="keywords" content="HTML, CSS, web development">
        <meta name="description" content="CWA Help Desk Appointment Web">
        <title> CWA Help Desk Appointment </title>
    </head>

    <body>
        <header>
             <img src="Images/logo.png" alt="Swinburne University Logo" width="100">
            <h1>CWA Help Desk Appointment</h1>
        </header>

        <main>
            <p>The Help Desk is located in ATC620. Open 10:30 to 19:00 Monday To Friday</p>
            <p>Check Blackboard for when CWA tutors will be there.</p>
            
            <form action="submit.php" method="GET">
                <fieldset>
                    <legend>Student Details</legend>
                    <p>
                        <label for="studentID">Student ID</label>
                        <input type="text" name="studentID" id="studentID" pattern="\d{7,10}" required="required" minlength="7" maxlength="10"/>
                    </p>
                    <p>
                        <label for="givenName">Given Name</label>
                        <input type="text" name="givenName" id="givenName" pattern="[A-Za-z]{1,15}" required="required" maxlength="15"/>
                        
                        <label for="familyName">Family Name</label>
                        <input type="text" name="familyName" id="familyName" pattern="[A-Za-z]{1,15}" required="required" maxlength="15"/>
                    </p>
                </fieldset>

                <fieldset>
                    <legend>Your unit</legend>
                    <p>
                        <input type="radio" name="unitCourseID" id="COS10011" required="required"/>
                        <label for="COS10011">COS10011</label>

                        <input type="radio" name="unitCourseID" id="COS60004" required="required"/>
                        <label for="COS60004">COS60004</label>

                        <input type="radio" name="unitCourseID" id="COS60007" required="required"/>
                        <label for="COS60007">COS60007</label>
                    </p>
                    <p>
                        <label for="yourTutor">Your Tutor</label>
                        <select name="yourTutor" id="yourTutor" required="required">
                            <option value="">Please Select</option>
                            <option value="tutorOne">tutorNameOne</option>
                            <option value="tutorTwo">tutorNameTwo</option>
                            <option value="tutorThree">tutorNameThree</option>
                            <option value="tutorFour">tutorNameFour</option>
                            <option value="tutorFive">tutorNameFive</option>
                            <option value="tutorSix">tutorNameSix</option>
                            <option value="tutorSeven">tutorNameSeven</option>
                        </select>
                    </p>
                </fieldset>

                <fieldset>
                    <legend>Issue</legend>
                    <p>
                        <label for="Issue">HTML</label>
                        <input type="checkbox" id="HTML" checked="checked"/>

                        <label for="Issue">CSS</label>
                        <input type="checkbox" id="CSS"/>

                        <label for="Issue">JavaScript</label>
                        <input type="checkbox" id="JavaScript"/>

                        <label for="Issue">PHP</label>
                        <input type="checkbox" id="PHP"/>

                        <label for="Issue">MySQL</label>
                        <input type="checkbox" id="MySQL"/>
                    </p>
                    <br>
                    <p>Description of Issue</p>
                    <p>
                        <textarea id="issueDescription" name="issueDescription" rows="6" cols="40" placeholder="Write description of your problem here..."></textarea>
                    </p>
                </fieldset>

                <fieldset>
                    <legend>Preferred Date/Time</legend>
                    <p>
                        <label for="Date">Date</label>
                        <input type="text" id="Date" placeholder="dd/mm/yyyy" required="required" pattern="[0-9]{2}/[0-9]{2}/[0-9]{4}">
                    </p>
                    <p>
                        <label for="Time">Time</label>
                        <input type="text" id="Time" placeholder="00:00" required="required" pattern="[0-9]{2}:[0-9]{2}">
                    </p>
                </fieldset>

                <input type="submit" value="Book">
                <input type="reset" value="Reset form">
            </form>

            

        </main>


        <footer>

        </footer>
    </body>

</html>
